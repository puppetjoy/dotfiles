---
stages:
  - 'Build'
  - 'Trigger'

'Test XMonad fullscreen policy':
  stage: 'Build'
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - 'ruby test/xmonad_manual_fullscreen_test.rb'
    - 'python3 test/graphical_session_environment_test.py'

'Preprocess templates':
  stage: 'Build'
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  before_script:
    - 'git config --global user.name "Dotfiles CI"'
    - 'git config --global user.email git@joyfullee.me'
    - 'eval $(ssh-agent -s)'
    - 'chmod 600 "$SSH_PRIVATE_KEY" && ssh-add "$SSH_PRIVATE_KEY"'
    - 'git remote set-url origin git@gitlab.joyfullee.me:joy/dotfiles.git'
  script:
    - 'FACTER_preprocessed=true ./.refresh'
    - 'git add -f .'
    - 'git commit -m "Preprocess templates" --no-gpg-sign'
    - 'git push --force origin HEAD:preprocessed'

.'Refresh stage1':
  stage: 'Trigger'
  variables:
    BUILD: 'server'
    REFRESH: 'true'
  trigger:
    project: 'nest/stage1'
